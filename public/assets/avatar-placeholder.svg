<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />

  <!-- Cyber Grid Lines -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
  </g>

  <!-- Halo ring -->
  <circle cx="200" cy="165" r="95" fill="none" stroke="url(#cyberGlow)" stroke-width="3" opacity="0.4" stroke-dasharray="8 6" filter="url(#glow)"/>

  <!-- Stylized Architect Silhouette / Emblem -->
  <!-- Head -->
  <circle cx="200" cy="155" r="62" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
  <!-- Hair / Shadow Accent -->
  <path d="M 150 145 C 160 105, 240 105, 250 145 C 240 120, 160 120, 150 145 Z" fill="#0284c7" />

  <!-- Shoulders & Torso -->
  <path d="M 90 350 C 90 260, 140 240, 200 240 C 260 240, 310 260, 310 350 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
  <!-- Lapel / Tech Suit Lines -->
  <path d="M 160 250 L 200 320 L 240 250" fill="none" stroke="url(#cyberGlow)" stroke-width="2.5" />
  <line x1="200" y1="320" x2="200" y2="370" stroke="#38bdf8" stroke-width="2" />

  <!-- Monogram Initials Tag -->
  <rect x="165" y="340" width="70" height="26" rx="13" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
  <text x="200" y="357" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">MKS</text>
</svg>
